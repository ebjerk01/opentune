[package]
name = "opentune-desktop"
version = "0.7.0"
description = "OpenTune desktop app"
edition = "2021"
license = "GPL-3.0-or-later"
# This crate is intentionally NOT part of the root Cargo workspace; the desktop
# app builds on its own (`cargo build` / `tauri build` from `desktop/`).
[workspace]

# Library + thin binary: the `opentune_desktop` library holds the whole backend
# so another Tauri app can embed it and add its own commands (docs/PLUGINS.md);
# src/main.rs only runs it.
[lib]
name = "opentune_desktop"
path = "src/lib.rs"

[[bin]]
name = "opentune-desktop"
path = "src/main.rs"

# access(2) for the DMA-BUF render-node check (src/dmabuf.rs).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Diagnostics upload (src/diagupload): the HTTPS client and TLS stack the
# updater plugin already brings in (same versions and features, rustls with
# the ring provider), so no new crate enters the build.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# The shared OpenTune core and helpers, by relative path into the workspace.
opentune-core = { path = "../../crates/opentune-core" }
opentune-checksum = { path = "../../crates/opentune-checksum" }
opentune-flash = { path = "../../crates/opentune-flash" }

# Offline analysis + definition-import + utility crates wired into the panels.
opentune-scan = { path = "../../crates/opentune-scan" }
opentune-vin = { path = "../../crates/opentune-vin" }
opentune-dtc = { path = "../../crates/opentune-dtc" }
opentune-xdf = { path = "../../crates/opentune-xdf" }
opentune-a2l = { path = "../../crates/opentune-a2l" }

# The adapter/session layer (hub, addressing, driver registry + probe, seed/key
# lookup, build channel, map codecs, vault listing), shared with other front
# ends; the interface drivers are wired into its registry.
opentune-hub = { path = "../../crates/opentune-hub" }

# Service engines + conformance sim, wired into the (alpha) Debug panel.
opentune-coding = { path = "../../crates/opentune-coding" }
opentune-adaptation = { path = "../../crates/opentune-adaptation" }
opentune-autoscan = { path = "../../crates/opentune-autoscan" }
opentune-servicefn = { path = "../../crates/opentune-servicefn" }
opentune-logdef = { path = "../../crates/opentune-logdef" }
# Optional GPS/GNSS source (NMEA serial reader + replay) for Live log / Dashboard.
opentune-gps = { path = "../../crates/opentune-gps" }
# Definition packs: the panels' pack picker lists them.
opentune-packs = { path = "../../crates/opentune-packs" }
opentune-udssim = { path = "../../crates/opentune-udssim" }

# Control-unit reference database (Database panel).
opentune-db = { path = "../../crates/opentune-db" }
# Full CAN bus capture (CAN capture panel).
opentune-candump = { path = "../../crates/opentune-candump" }
# Offline log viewer + map overlay (Log viewer panel).
opentune-logview = { path = "../../crates/opentune-logview" }
# Haldex AWD: OpenHaldex UDS client, Gen4 read, CAN-log decode (Haldex panel).
opentune-haldex = { path = "../../crates/opentune-haldex" }
# Drivetrain controller definitions: list / show / offline CAN-log decode (Controllers panel).
opentune-ctrldef = { path = "../../crates/opentune-ctrldef" }
# TunerStudio-compatible aftermarket ECUs: INI + .msq, serial protocol (TS panel).
opentune-tsini = { path = "../../crates/opentune-tsini" }
opentune-tsproto = { path = "../../crates/opentune-tsproto" }
# VAG SA2 seed/key interpreter + the user's own flash containers (SA2 panel).
opentune-sa2 = { path = "../../crates/opentune-sa2" }
# Off-by-default loader for the user's own UnlockECU-format seed/key files
# (DesktopConfig::seedkey_loader; Bench tier: alpha / bench channels only).
opentune-seedkey-loader = { path = "../../crates/opentune-seedkey-loader" }
opentune-container = { path = "../../crates/opentune-container" }

[features]
# Tauri's default behaviour for a release build.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Alpha channel: exposes the live Debug panel (all engines + live drivers +
# session log). Never enabled in a stable/release build.
alpha = ["opentune-hub/alpha"]

[dev-dependencies]
# The simulated multi-module bus and test-only seed/key resolvers.
opentune-hub = { path = "../../crates/opentune-hub", features = ["testkit"] }
# The Haldex panel's tests drive OpenHaldex over a simulated SLCAN port.
opentune-driver-slcan = { path = "../../crates/drivers/slcan" }

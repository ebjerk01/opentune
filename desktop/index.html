<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenTune</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 1.5rem; max-width: 720px; }
      h1 { font-size: 1.3rem; margin: 0 0 1rem; }
      section { margin-bottom: 1.25rem; }
      label { display: inline-block; min-width: 6rem; }
      select, button { font: inherit; padding: 0.35rem 0.6rem; }
      button { cursor: pointer; margin-right: 0.5rem; }
      button:disabled { opacity: 0.5; cursor: default; }
      #log {
        white-space: pre-wrap; background: rgba(127,127,127,0.12);
        border-radius: 6px; padding: 0.75rem; min-height: 6rem;
        font-family: ui-monospace, monospace; font-size: 0.85rem;
      }
      .warn { font-size: 0.8rem; opacity: 0.7; }
    </style>
  </head>
  <body>
    <h1>OpenTune</h1>

    <section>
      <label for="driver">Driver</label>
      <select id="driver"></select>
    </section>

    <section>
      <button id="connect">Connect</button>
      <button id="identify" disabled>Identify</button>
      <button id="read" disabled>Read region</button>
    </section>

    <section>
      <div id="log">Ready.</div>
    </section>

    <p class="warn">
      Early work in progress. Nothing here is ready to touch a real car.
    </p>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>

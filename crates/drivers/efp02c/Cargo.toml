[package]
name = "opentune-driver-efp02c"
version.workspace = true
edition.workspace = true
license.workspace = true
# nusb 0.2 needs Rust 1.85.
rust-version = "1.85"
description = "EFI Technology EFP02C USB-CAN adapter driver for OpenTune (UNVERIFIED: implemented from captures of the owner's own unit)."

[dependencies]
opentune-core = { path = "../../opentune-core" }
# Pure-Rust USB (no libusb C dependency) on Linux, Windows (WinUSB) and macOS.
nusb = "0.2"

# ELM327 **serial** diagnostics driver: a USB ELM327 (CH340 serial) talking
# ISO 15765-4 (CAN) — identify, DTCs, live OBD-II PIDs, UDS transport, and a
# single-frame-safe block read (0x23 or 0x35/0x36/0x37). Distinct from `opentune-driver-elm327` (kline-elm327, flash/memory
# oriented) and `opentune-driver-elm327net` (same AT dialect over WiFi/Bluetooth).
[package]
name = "opentune-driver-elm327-obd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ELM327 serial diagnostics + block-read driver (UDS/OBD-II over ISO-TP) for OpenTune."

[dependencies]
opentune-core = { path = "../../opentune-core" }
opentune-dtc = { path = "../../opentune-dtc" }
serialport.workspace = true

# gs_usb / candleLight USB-CAN driver for OpenTune.
#
# Two ways to reach a gs_usb device:
#   * the Linux kernel `gs_usb` driver, which presents the adapter as an
#     ordinary SocketCAN interface (`canX`) — used here on Linux;
#   * the raw libusb `gs_usb` host-frame protocol, for which this crate provides
#     the frame codec ([`codec`]) so a libusb backend can be added later.
# Either way a `CanLink` is layered with the fixed opentune-core ISO-TP + UDS
# stack, exactly like the SocketCAN driver.
#
# NOTE: this is a STANDALONE workspace crate for now — the empty `[workspace]`
# table at the bottom detaches it from the repo root so it builds on its own
# while the root Cargo.toml is being edited elsewhere. To wire it into the main
# workspace, ADD "crates/drivers/gsusb" to the root `members` list and DELETE
# the `[workspace]` table at the bottom of this file. (Same pattern
# opentune-xdf / esp32-opentune used while being brought up.)
[package]
name = "opentune-driver-gsusb"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ebjerk01/opentune"
authors = ["OpenTune contributors"]
rust-version = "1.75"
publish = false
description = "gs_usb / candleLight USB-CAN driver for OpenTune (SocketCAN path + gs_usb host-frame codec)."

[dependencies]
opentune-core = { path = "../../opentune-core" }

# The kernel gs_usb path goes through SocketCAN, which is Linux-only; scope the
# dependency so the crate still compiles (as an Unsupported stub) elsewhere.
[target.'cfg(target_os = "linux")'.dependencies]
socketcan = "3"

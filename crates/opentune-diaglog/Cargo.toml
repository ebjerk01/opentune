[package]
name = "opentune-diaglog"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# No `rust-version`: the code (moved unchanged from the desktop, which has
# none either) uses `Option::is_none_or` (1.82) and `PanicHookInfo` (1.81),
# so the workspace's 1.75 would be false; same as `opentune-db`.
publish = false
description = "Frontend-neutral local diagnostics log for OpenTune front ends: size-capped, rotating JSON-lines records with write-time masking of SecurityAccess seeds/keys and long hex payloads, a chained panic hook, rate-limited frontend reports and read-back (tail, latest session, sessions)."

# The crate root keeps the file name it had in the desktop app
# (`desktop/src-tauri/src/diaglog.rs`), so the moved code, its docs and its
# tests (the panic-hook test checks the panic location) stay unchanged.
[lib]
path = "src/diaglog.rs"

[dependencies]
opentune-core = { path = "../opentune-core" }
serde = { workspace = true }
serde_json = { workspace = true }

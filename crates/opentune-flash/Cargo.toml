[package]
name = "opentune-flash"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
opentune-core = { path = "../opentune-core" }
# Decoded flash containers (VBF / ODX / FRF / SGO) feed the UDS module flasher.
opentune-container = { path = "../opentune-container" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
opentune-driver-mock = { path = "../drivers/mock" }
# The UDS module flasher is tested end to end against the simulated ECU.
opentune-udssim = { path = "../opentune-udssim" }

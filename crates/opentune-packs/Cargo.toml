[package]
name = "opentune-packs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
description = "Definition packs for OpenTune: one versioned, loadable bundle of ECU defs, coding labels, adaptation channels, service-function scripts, logger defs, module lists and drivetrain controller definitions."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
opentune-core = { path = "../opentune-core" }
opentune-coding = { path = "../opentune-coding" }
opentune-adaptation = { path = "../opentune-adaptation" }
opentune-servicefn = { path = "../opentune-servicefn" }
opentune-logdef = { path = "../opentune-logdef" }
opentune-autoscan = { path = "../opentune-autoscan" }
opentune-ctrldef = { path = "../opentune-ctrldef" }

[dev-dependencies]
# tests/repo_packs.rs re-fits every shipped logger conversion with the same
# fitter the importers use, so a hand-edited factor/offset cannot drift.
opentune-xdf = { path = "../opentune-xdf" }

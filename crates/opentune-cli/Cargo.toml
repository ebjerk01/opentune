[package]
name = "opentune-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opentune"
path = "src/main.rs"

[dependencies]
opentune-core = { path = "../opentune-core" }
opentune-checksum = { path = "../opentune-checksum" }
opentune-flash = { path = "../opentune-flash" }
opentune-driver-mock = { path = "../drivers/mock" }
opentune-driver-openport2 = { path = "../drivers/j2534-openport" }
opentune-driver-socketcan = { path = "../drivers/socketcan" }
opentune-driver-elm327 = { path = "../drivers/kline-elm327" }
opentune-driver-kkl = { path = "../drivers/kkl" }
opentune-driver-kline-bridge = { path = "../drivers/kline-bridge" }
opentune-driver-slcan = { path = "../drivers/slcan" }
opentune-driver-j2534 = { path = "../drivers/j2534" }
opentune-driver-gsusb = { path = "../drivers/gsusb" }
opentune-driver-elm327net = { path = "../drivers/elm327net" }
opentune-driver-elm327-obd = { path = "../drivers/elm327" }
opentune-driver-vcar = { path = "../drivers/vcar" }
opentune-driver-efp02c = { path = "../drivers/efp02c" }
opentune-driver-isotp-ble = { path = "../drivers/isotp-ble-bridge" }
opentune-driver-doip = { path = "../drivers/doip" }
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
opentune-dtc = { path = "../opentune-dtc" }
opentune-xdf = { path = "../opentune-xdf" }
opentune-a2l = { path = "../opentune-a2l" }
opentune-ecuflash = { path = "../opentune-ecuflash" }
opentune-packs = { path = "../opentune-packs" }
opentune-vin = { path = "../opentune-vin" }
opentune-scan = { path = "../opentune-scan" }
opentune-container = { path = "../opentune-container" }
opentune-cbf = { path = "../opentune-cbf" }
opentune-coding = { path = "../opentune-coding" }
opentune-adaptation = { path = "../opentune-adaptation" }
opentune-autoscan = { path = "../opentune-autoscan" }
opentune-servicefn = { path = "../opentune-servicefn" }
opentune-ols = { path = "../opentune-ols" }
opentune-udssim = { path = "../opentune-udssim" }
opentune-attest = { path = "../opentune-attest" }
opentune-logdef = { path = "../opentune-logdef" }
opentune-db = { path = "../opentune-db" }
opentune-candump = { path = "../opentune-candump" }
opentune-mapfind = { path = "../opentune-mapfind" }
opentune-recipe = { path = "../opentune-recipe" }
opentune-haldex = { path = "../opentune-haldex" }
opentune-dsg = { path = "../opentune-dsg" }
opentune-ctrldef = { path = "../opentune-ctrldef" }
opentune-tsini = { path = "../opentune-tsini" }
opentune-tsproto = { path = "../opentune-tsproto" }
opentune-sa2 = { path = "../opentune-sa2" }
opentune-c167bsl = { path = "../opentune-c167bsl" }
# GPS/GNSS source for `log --gps` and `gps` (serial reader + NMEA replay).
opentune-gps = { path = "../opentune-gps" }
# Ctrl-C ends a `candump` capture cleanly (file finished, adapter released).
ctrlc = "3"

[dev-dependencies]
# Re-import the generated XDF in the a2l2xdf round-trip integration test.
opentune-xdf = { path = "../opentune-xdf" }
opentune-core = { path = "../opentune-core" }
# The `ts log` smoke test opens its CSV with the log viewer's parser.
opentune-logview = { path = "../opentune-logview" }

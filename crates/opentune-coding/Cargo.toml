[package]
name = "opentune-coding"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ebjerk01/opentune"
authors = ["OpenTune contributors"]
rust-version = "1.75"
description = "Module coding / configuration engine (read, decode, edit, diff, write) for OpenTune, driven by data-defined coding-label sets over UDS"
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
opentune-core = { path = "../opentune-core" }
# roxmltree 0.20.0 (2023-12-29): small pull-free DOM reader, already used by
# opentune-xdf / -logdef / -tsini; reads Ford .ab files and CCF/CCC descriptors.
roxmltree = "0.20.0"

[dev-dependencies]
opentune-udssim = { path = "../opentune-udssim" }

# C166/C167/ST10 bootstrap-loader (BSL) client: plan and run a read-only
# memory read over a raw serial / K-line byte stream, with a simulated C167
# BSL responder for tests and offline demos. No loader binary ships here; the
# primary loader and monitor kernel are user-supplied files.
[package]
name = "opentune-c167bsl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
description = "Plan and run a read-only C167/ST10 bootstrap-mode memory read (EDC15 presets), with a simulated BSL responder."

[dependencies]
serialport = { workspace = true }
thiserror = { workspace = true }

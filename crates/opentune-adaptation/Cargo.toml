[package]
name = "opentune-adaptation"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ebjerk01/opentune"
authors = ["OpenTune contributors"]
rust-version = "1.75"
description = "Adaptation / basic-settings / actuator-test engine for OpenTune, driven by data-defined adaptation-channel sets: UDS (RoutineControl, Read/WriteDataByIdentifier, InputOutputControlByIdentifier) and VAG KWP2000 over TP2.0 / K-line (measuring blocks, basic settings, adaptation read/test/save)"
publish = false

[dependencies]
opentune-core = { path = "../opentune-core" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
opentune-udssim = { path = "../opentune-udssim" }

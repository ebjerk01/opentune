name: Release

# Cut a release by pushing a tag like `v1.2.3`. The workflow builds the
# `opentune` CLI for every target platform and the Tauri desktop app (with the
# auto-update artifacts), then attaches everything to the GitHub Release for the
# tag. `workflow_dispatch` runs the same build as a dry run (nothing is
# published) so the pipeline can be exercised without cutting a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# The jobs create/update the Release and upload assets, so the token needs write
# access to repository contents.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # CLI binaries: build `opentune` for Linux, Windows and macOS (Intel + Apple
  # silicon), archive each one, and upload it as a release asset.
  # ---------------------------------------------------------------------------
  cli:
    name: CLI · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # libudev is needed by the `serialport` crate that several drivers link.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build the opentune CLI
        run: cargo build --release -p opentune-cli --target ${{ matrix.target }}

      # Package the binary into a tar.gz (unix) or zip (windows). The archive is
      # named opentune-<tag>-<target> so release assets are self-describing.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          stage="opentune-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$stage"
          cp "target/${{ matrix.target }}/release/opentune" "$stage/"
          cp README.md "$stage/" 2>/dev/null || true
          cp LICENSE* "$stage/" 2>/dev/null || true
          tar -czf "$stage.tar.gz" "$stage"
          echo "ASSET=$stage.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "opentune-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/opentune.exe" $stage
          Copy-Item "README.md" $stage -ErrorAction SilentlyContinue
          Copy-Item "LICENSE*" $stage -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stage/*" -DestinationPath "$stage.zip"
          "ASSET=$stage.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Only attach to a Release when a tag was pushed. On workflow_dispatch the
      # build still runs (verifying the pipeline) but nothing is published.
      - name: Upload CLI archive to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Desktop app: build the Tauri bundles (AppImage/.deb on Linux, .dmg on macOS,
  # .msi on Windows) plus the updater artifacts (latest.json + .sig) and attach
  # them to the Release. Updater signing requires two repository secrets; when
  # they are absent (e.g. a dry run) the build runs with updater artifacts
  # disabled so the job still succeeds.
  # ---------------------------------------------------------------------------
  desktop:
    name: Desktop · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # WebKitGTK and friends are required to build the Linux Tauri bundle.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libudev-dev \
            pkg-config

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          # The desktop crate builds outside the workspace, in desktop/src-tauri.
          workspaces: desktop/src-tauri
          key: desktop-${{ matrix.os }}

      - name: Set up Node.js (for the Tauri CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install desktop JS dependencies (@tauri-apps/cli)
        working-directory: desktop
        run: npm install

      # Detect whether the updater signing secrets are configured. Referencing a
      # secret here only tells us whether it is non-empty; the value stays masked.
      - name: Detect updater signing secrets
        id: signing
        shell: bash
        run: |
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY is not set - building without updater artifacts (dry run)."
          fi

      # Real release: secrets present AND a tag was pushed. tauri-action builds
      # the bundles, signs the updater artifacts, generates latest.json, and
      # uploads everything to the Release for the tag.
      - name: Build & publish desktop bundles (signed)
        if: steps.signing.outputs.enabled == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'OpenTune ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # Dry run / no signing key: build the bundles to prove the pipeline works,
      # but override tauri.conf.json to skip updater-artifact generation (which
      # would otherwise require a signing key) and publish nothing.
      - name: Prepare keyless build config
        if: steps.signing.outputs.enabled != 'true'
        shell: bash
        run: echo '{"bundle":{"createUpdaterArtifacts":false}}' > "${{ runner.temp }}/no-updater.json"

      - name: Build desktop bundles (dry run, no signing key)
        if: steps.signing.outputs.enabled != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: --config ${{ runner.temp }}/no-updater.json

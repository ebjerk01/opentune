name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (libudev for the serialport crate)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      # Lint the whole workspace. Deny warnings to keep the tree clean; if a
      # transient upstream/nightly lint makes this too noisy, flip `-D warnings`
      # to `-W warnings` to make it non-blocking without removing the step.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace

  # The UDS simulator against independent third-party clients: python-udsoncan
  # (UDS) over python-doipclient (DoIP) talking to the doip_tcp_entity example on
  # loopback. See tools/conformance/README.md. Pinned versions, no network
  # beyond the pip install.
  conformance:
    name: udssim conformance · python-udsoncan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the conformance clients
        run: pip install -r tools/conformance/requirements.txt

      - name: Build the loopback DoIP entity
        run: cargo build -p opentune-udssim --example doip_tcp_entity

      - name: Run the harness
        run: python tools/conformance/udsoncan_harness.py --entity target/debug/examples/doip_tcp_entity

  # The SA2 seed/key VM against the public reference implementation
  # (bri3d/sa2_seed_key, MIT): re-checks the committed vectors and runs fresh
  # synthetic programs through both. Test-only; no OEM script is involved.
  # See tools/sa2/README.md.
  sa2:
    name: sa2 VM · reference sa2-seed-key
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the reference implementation
        run: pip install -r tools/sa2/requirements.txt

      - name: Build the evaluator
        run: cargo build -p opentune-sa2 --example sa2_eval

      - name: Differential check
        run: python -I tools/sa2/sa2_differential.py check --fixture crates/opentune-sa2/tests/fixtures/sa2_vectors.txt --eval target/debug/examples/sa2_eval --fresh 2000

  # Gate every PR on the ECU-definition library: parse + the format / honesty /
  # scope rules in docs/CONTRIBUTING-ECUDEFS.md. Fails the build on any
  # validation error (warnings are advisory and do not fail). See
  # `opentune ecudefs validate` and crates/opentune-core/src/validate.rs.
  ecudefs:
    name: validate ecudefs · db
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Android bundled ecudefs match the root set
        run: android/sync-ecudefs.sh --check

      - name: Install system dependencies (libudev for the serialport crate)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Validate ECU definitions
        run: cargo run -p opentune-cli --quiet -- ecudefs validate ecudefs

      - name: Validate the control-unit database
        run: cargo run -p opentune-cli --quiet -- db validate

  # The Tauri desktop crate (desktop/src-tauri) opts out of the workspace, so the
  # `check` job never sees it. Gate it here: fmt, clippy with the default and
  # the `alpha` feature set (the engine panels), and the tests. Same order as
  # scripts/check.sh. ubuntu-22.04 matches the release/portable glibc baseline.
  desktop:
    name: desktop · fmt · clippy · test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # WebKitGTK and friends are required to compile Tauri 2 on Linux.
      - name: Install system dependencies (Tauri 2 + libudev)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev \
            pkg-config

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: desktop-ci

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (--features alpha)
        run: cargo clippy --all-targets --features alpha -- -D warnings

      - name: Test (--features alpha)
        run: cargo test --features alpha

  # The UI is plain JS with no bundler, so nothing else would notice a syntax
  # error before a user opens the panel. Cheap: no Rust, no npm install.
  ui:
    name: ui · node --check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check the desktop UI and preview scripts
        run: |
          rc=0
          for f in desktop/ui/src/*.js desktop/preview/*.js; do
            node --check "$f" || { echo "::error file=$f::syntax error"; rc=1; }
          done
          exit $rc

      - name: UI unit tests (node --test)
        if: hashFiles('desktop/ui/tests/**') != ''
        # Pass files explicitly: Node's directory/glob handling differs by version.
        run: find desktop/ui/tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z | xargs -0 -r node --test

  # The release workflow refuses a tag whose version disagrees with the repo, so
  # keep every version field in step on main (scripts/bump-version.sh), and keep
  # the latest.json generator honest (signature checks against a public
  # minisign test vector; no keys involved). Python only, a few seconds.
  release-scripts:
    name: release scripts · version check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version fields agree
        run: scripts/bump-version.sh --check

      - name: Release helper self-test
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "cryptography==44.0.0"
          PYTHON="$RUNNER_TEMP/venv/bin/python" REQUIRE_CRYPTO=1 scripts/test-release-scripts.sh

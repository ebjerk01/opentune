# Issue forms for OpenTune. Blank issues are off so every report states its
# scope and privacy checks; questions and security reports go elsewhere.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability (private report)
    url: https://github.com/ebjerk01/opentune/security/advisories/new
    about: Report security problems privately, never in a public issue.
  - name: How to contribute definitions and packs
    url: https://github.com/ebjerk01/opentune/blob/main/CONTRIBUTING.md
    about: Contributing data (ECU definitions, packs, controller definitions) - provenance, clean-room and privacy rules, the validators to run on your fork.

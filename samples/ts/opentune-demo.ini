;-------------------------------------------------------------------------------
; OpenTune demo ECU definition -- SYNTHETIC, hand-written for tests and demos.
; It describes no real ECU. Written in the TunerStudio INI format the open
; firmware projects (Speeduino, rusEFI, MegaSquirt) publish, Speeduino-like:
; little-endian, CRC32 "msEnvelope" framing, page/burn/CRC commands.
; Use it with the built-in simulator:  opentune ts read --port sim --ini <this>
;-------------------------------------------------------------------------------
#unset FAHRENHEIT

[MegaTune]
   MTversion      = 2.25
   queryCommand   = "Q"
   signature      = "opentune demo 1"
   versionInfo    = "S" ; shown in the title bar

[TunerStudio]
   iniSpecVersion = 3.64

[SettingGroups]
   settingGroup  = temp_units, "Temperature"
   settingOption = DEFAULT, "Celsius"
   settingOption = FAHRENHEIT, "Fahrenheit"

[PcVariables]
   tsCanId = bits,   U08, [0:3], "CAN ID 0", "CAN ID 1", "CAN ID 2", "CAN ID 3"
   stoich  = scalar, U08, "AFR", 0.1, 0, 10, 25, 1
   rpmwarn = scalar, U16, "rpm", 1, 0, 0, 30000, 0

[Constants]
   endianness          = little
   nPages              = 2
   pageSize            = 64, 112
   pageIdentifier      = "\$tsCanId\x01", "\$tsCanId\x02"
   pageReadCommand     = "p%2i%2o%2c", "p%2i%2o%2c"
   pageValueWrite      = "M%2i%2o%2c%v", "M%2i%2o%2c%v"
   pageChunkWrite      = "M%2i%2o%2c%v", "M%2i%2o%2c%v"
   crc32CheckCommand   = "d%2i", "d%2i"
   burnCommand         = "b%2i", "b%2i"
   blockingFactor      = 32 ; deliberately small so chunking is exercised
   delayAfterPortOpen  = 1000
   blockReadTimeout    = 2000
   tsWriteBlocks       = on
   interWriteDelay     = 10
   pageActivationDelay = 10
   messageEnvelopeFormat = msEnvelope_1.0

   #define injModes = "Paired", "Semi-Sequential", "INVALID", "Sequential"

page = 1
   ;  name     = class,  type, offset, shape/bits, units, scale, translate, lo, hi, digits
   reqFuel    = scalar, U08,   0,        "ms",  0.1,     0,     0,  25.5, 1
   crankRPM   = scalar, U16,   1,        "rpm", 10,      0,   100,  1000, 0
   cltOffset  = scalar, S08,   3,        "C",   1,       0,   -40,    40, 0
   injLayout  = bits,   U08,   4, [0:1], $injModes
   nCyl       = bits,   U08,   4, [2:5], "INVALID", "1", "2", "3", "4"
   wueBins    = array,  U08,   5, [6],   "C",   1,     -40,   -40,   215, 0
   ; lastOffset = the previous constant's offset: a second view of the same bytes
   wueBinsK   = array,  U08, lastOffset, [6], "K", 1, 233.15, 233.15, 488.15, 2
   wueRates   = array,  U08,  11, [6],   "%",   1,       0,   100,   255, 0
   flags      = bits,   U16,  17, [8:11], "a", "b", "b"
   injOpen    = scalar, S16,  19,        "ms",  0.001,   0,   -32,    32, 3
   afrTarget  = scalar, U08,  21,        "lambda", { 0.1 / stoich }, 0, 0.5, 1.5, 3
#if FAHRENHEIT
   idleTemp   = scalar, U08,  22,        "F",   1.8,  22.2222, -40,  300, 0
#else
   idleTemp   = scalar, U08,  22,        "C",   1,     -40,   -40,   215, 0
#endif
   boostGain  = scalar, F32,  24,        "",    1,       0, -1000,  1000, 4
   tuneName   = string, ASCII, 28, 16
   wideU32    = scalar, U32,  44,        "us",  1,       0,     0,   4e9, 0
   negS32     = scalar, S32,  48,        "",    0.5,     0,  -1e9,   1e9, 1
   unusedTail = array,  U08,  52, [12],  "",    1,       0,     0,   255, 0, noMsqSave

page = 2
   veTable    = array,  U08,   0, [8x6], "%",   1,       0,     0,   255, 0
   rpmBins    = array,  U08,  48, [8],   "RPM", 100,     0,   100, 25500, 0
   mapBins    = array,  U08,  56, [6],   "kPa", 2,       0,     0,   510, 0
   advTable   = array,  S16,  62, [4x4], "deg", 0.1,     0,   -10,    60, 1
   advRpm     = array,  U16,  94, [4],   "RPM", 1,       0,     0, 20000, 0
   advLoad    = array,  U08, 102, [4],   "kPa", 1,       0,     0,   255, 0
   aeBins     = array,  U08, 106, [3],   "%/s", 10,      0,     0,  2550, 0
   aeRates    = array,  U08, 109, [3],   "%",   1,       0,     0,   255, 0

[OutputChannels]
   ochGetCommand = "r\$tsCanId\x30%2o%2c"
   ochBlockSize  = 12

   secl        = scalar, U08,  0, "s",    1.000, 0.000
   status      = scalar, U08,  1, "bits", 1.000, 0.000
   running     = bits,   U08,  1, [0:0]
   crank       = bits,   U08,  1, [1:1]
   map         = scalar, U16,  2, "kPa",  1.000, 0.000
   coolantRaw  = scalar, U08,  4, "C",    1.000, 0.000
   rpm         = scalar, U16,  5, "rpm",  1.000, 0.000
   afr         = scalar, U08,  7, "AFR",  0.100, 0.000
   advance     = scalar, S08,  8, "deg",  1.000, 0.000
   batteryV    = scalar, U08,  9, "V",    0.100, 0.000
   tps         = scalar, U16, 10, "%",    0.500, 0.000
#if FAHRENHEIT
   coolant     = { (coolantRaw - 40) * 1.8 + 32 }, "F"
#else
   coolant     = { coolantRaw - 40 }, "C"
#endif
   lambda      = { afr / stoich }
   loadPct     = { map / 2 }, "%"
   smoothRpm   = { smoothBasic(rpm, 4) }, "rpm" ; not supported: reported, not guessed
   isRunning   = { running && rpm > 400 }

[TableEditor]
   ;       table_id, map3d_id, "title",  page
   table = veTbl,    veMap,    "VE Table", 2
      topicHelp   = "Volumetric efficiency"
      xBins       = rpmBins, rpm
      yBins       = mapBins, map
      zBins       = veTable
      xyLabels    = "RPM", "MAP: "
      upDownLabel = "(RICHER)", "(LEANER)"
      gridHeight  = 2.0
   table = advTbl,   advMap,   "Advance",  2
      xBins       = advRpm, rpm
      yBins       = advLoad, map
      zBins       = advTable

[CurveEditor]
   curve = wueCurve, "Warmup enrichment"
      columnLabel = "Coolant", "WUE %"
      xAxis       = -40, 120, 9
      yAxis       = 0, 200, 5
      xBins       = wueBins, coolant
      yBins       = wueRates
   curve = aeCurve, "Accel enrichment"
      xBins       = aeBins
      yBins       = aeRates

[Menu]
   menuDialog = main
   menu = "&Fuel"
      subMenu = veTbl,    "VE Table"
      subMenu = std_separator
      subMenu = wueCurve, "Warmup", 0, { nCyl > 0 }
   menu = "&Spark"
      subMenu = advTbl,   "Advance"

[GaugeConfigurations]
   gaugeCategory = "Main"
   rpmGauge = rpm, "RPM", "", 0, 8000, 300, 600, 6000, 7000, 0, 0

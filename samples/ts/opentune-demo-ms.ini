;-------------------------------------------------------------------------------
; OpenTune demo ECU definition, MegaSquirt-like -- SYNTHETIC, for tests/demos.
; Big-endian, no CRC envelope (plain request/response), one page with an MS2
; style read/write/burn command set. Describes no real ECU.
;-------------------------------------------------------------------------------

[MegaTune]
   queryCommand = "Q"
   signature    = "OT-MSDEMO 1.0"

[Constants]
   endianness          = big
   nPages              = 1
   pageSize            = 40
   pageReadCommand     = "r\$tsCanId\x04%2o%2c"
   pageChunkWrite      = "w\$tsCanId\x04%2o%2c%v"
   burnCommand         = "b\$tsCanId\x04"
   blockingFactor      = 16
   pageActivationDelay = 10
   interWriteDelay     = 5

page = 1
   veTable  = array,  U08,  0, [4x4], "%",   1,     0,    0,   255, 0
   rpmBins  = array,  U16, 16, [4],   "rpm", 1,     0,    0, 10000, 0
   loadBins = array,  U08, 24, [4],   "kPa", 1,     0,    0,   255, 0
   reqFuel  = scalar, U16, 28,        "ms",  0.001, 0,    0,    25, 3
   tempOff  = scalar, S16, 30,        "C",   0.1,   0, -100,   100, 1
   mode     = bits,   U08, 32, [0:1], "A", "B", "C", "D"
   spare    = array,  U08, 33, [7],   "",    1,     0,    0,   255, 0

[OutputChannels]
   ochGetCommand = "A"
   ochBlockSize  = 8
   rpm   = scalar, U16, 0, "rpm", 1,   0
   clt   = scalar, S16, 2, "C",   0.1, 0
   map   = scalar, U16, 4, "kPa", 0.1, 0
   flags = scalar, U08, 6, "",    1,   0
   batt  = scalar, U08, 7, "V",   0.1, 0

[TableEditor]
   table = veTbl, veMap, "VE", 1
      xBins = rpmBins, rpm
      yBins = loadBins, map
      zBins = veTable

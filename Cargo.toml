[workspace]
resolver = "2"
members = [
    "crates/opentune-core",
    "crates/opentune-checksum",
    "crates/opentune-flash",
    "crates/opentune-cli",
    "crates/drivers/mock",
    "crates/drivers/j2534-openport",
    "crates/drivers/socketcan",
    "crates/drivers/kline-elm327",
    "crates/drivers/kkl",
    "crates/drivers/kline-bridge",
    "crates/drivers/slcan",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ebjerk01/opentune"
authors = ["OpenTune contributors"]
rust-version = "1.75"

[workspace.dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serialport = "4"
socketcan = "3"

# Keep debug builds quick; optimise release for a small shippable binary.
[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

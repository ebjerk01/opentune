[workspace]
resolver = "2"
members = [
    "crates/opentune-core",
    "crates/opentune-checksum",
    "crates/opentune-flash",
    "crates/opentune-cli",
    "crates/drivers/mock",
    "crates/drivers/j2534-openport",
    "crates/drivers/socketcan",
    "crates/drivers/kline-elm327",
    "crates/drivers/kkl",
    "crates/drivers/kline-bridge",
    "crates/drivers/slcan",
    "crates/drivers/esp32-opentune",
    "crates/drivers/j2534",
    "crates/drivers/gsusb",
    "crates/drivers/elm327net",
    "crates/drivers/elm327",
    "crates/drivers/vcar",
    "crates/drivers/efp02c",
    "crates/drivers/isotp-ble-bridge",
    "crates/opentune-dtc",
    "crates/opentune-xdf",
    "crates/opentune-a2l",
    "crates/opentune-vin",
    "crates/opentune-ffi",
    "crates/opentune-scan",
    "crates/opentune-container",
    "crates/opentune-cbf",
    "crates/opentune-coding",
    "crates/opentune-adaptation",
    "crates/opentune-ecuflash",
    "crates/opentune-logdef",
    "crates/opentune-servicefn",
    "crates/opentune-autoscan",
    "crates/opentune-image",
    "crates/opentune-sa2",
    "crates/opentune-packs",
    "crates/opentune-ols",
    "crates/opentune-udssim",
    "crates/opentune-attest",
    "crates/opentune-db",
    "crates/opentune-candump",
    "crates/opentune-logview",
    "crates/opentune-mapfind",
    "crates/opentune-recipe",
    "crates/opentune-haldex",
    "crates/opentune-tsini",
    "crates/opentune-tsproto",
    "crates/opentune-c167bsl",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ebjerk01/opentune"
authors = ["OpenTune contributors"]
rust-version = "1.75"

[workspace.dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serialport = "4"
socketcan = "3"

# The image scanners walk whole multi-MiB dumps; unoptimised they make the
# fixture tests crawl. Optimise just these crates in dev/test builds.
[profile.dev.package.opentune-mapfind]
opt-level = 3
[profile.dev.package.opentune-recipe]
opt-level = 3
[profile.dev.package.opentune-scan]
opt-level = 3

# Keep debug builds quick; optimise release for a small shippable binary.
[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
